apiVersion: apps/v1
kind: Deployment
metadata:
  name: i27-helpdesk-ui
  namespace: i27-helpdesk-dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: i27-helpdesk-ui

  template:
    metadata:
      labels:
        app: i27-helpdesk-ui

    spec:
      containers:
        - name: i27-helpdesk-ui
          image: __IMAGE_URI__

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
